
<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mana profila lapa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1 id="galvenais" class="izcelts">Mana profila lapa</h1>

    <nav>
        <ul>
            <li><a href="#par-mani">Par mani</a></li>
            <li><a href="#prasmes">Prasmes</a></li>
            <li><a href="#kontakti">Kontakti</a></li>
        </ul>
    </nav>
</header>

<main>
    <section id="par-mani">
        <h2 class="izcelts">Par mani</h2>

        <article class="vizitkarte">
            <img src="notebook.png" alt="Mans profila attēls" width="160">

            <div class="vizitkarte-teksts">
                <h3>Gļebs</h3>
                <p>IT students un programmēšanas entuziasts.</p>
                <p>Man patīk programmēšana, datorspēles un tīmekļa izstrāde.</p>
                <a href="#kontakti" class="poga">Sazināties</a>
            </div>
        </article>
    </section>

    <section id="prasmes">
        <h2>Manas prasmes</h2>

        <table border="1">
            <tr>
                <th>Prasme</th>
                <th>Līmenis</th>
            </tr>
            <tr>
                <td>HTML</td>
                <td>Labs</td>
            </tr>
            <tr>
                <td>CSS</td>
                <td>Vidējs</td>
            </tr>
            <tr>
                <td>C++</td>
                <td>Vidējs</td>
            </tr>
        </table>
    </section>

    <section id="kontakti">
        <h2>Kontakti</h2>

        <form>
            <label for="name">Vārds:</label>
            <input type="text" id="name" name="name">

            <label for="email">E-pasts:</label>
            <input type="email" id="email" name="email">

            <label for="message">Ziņa:</label>
            <textarea id="message" name="message"></textarea>

            <button type="submit">Nosūtīt</button>
        </form>
    </section>
</main>

<footer>
    <p>© 2026 Gleb</p>
</footer>

</body>
</html>
